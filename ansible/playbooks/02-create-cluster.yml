---
- name: Create HA Kubernetes cluster
  hosts: control_plane
  tasks:
    - name: Create cluster configuration
      ansible.builtin.shell: |
        kops create cluster \
        --name="cluster.joarmani.com.ng" \
        --state="s3://kops-state-20250525083938874700000001" \
        --zones="us-east-1a,us-east-1b" \
        --node-count=2 \
        --node-size=t2.micro \
        --control-plane-size=t2.micro \
        --yes
      args:
        executable: /bin/bash

    - name: Validate cluster
      ansible.builtin.shell: |
        kops validate cluster \
        --name="cluster.joarmani.com.ng" \
        --state="s3://kops-state-20250525083938874700000001" \
        --wait 10m
      args:
        executable: /bin/bash