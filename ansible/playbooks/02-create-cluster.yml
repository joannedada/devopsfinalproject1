---
- name: Create HA Kubernetes cluster
  hosts: control_plane
  vars:
    cluster_name: "{{ cluster_name | default('prod-cluster') }}.k8s.com"
    state_store: "s3://{{ kops_state_bucket }}"
    zones: "{{ availability_zones | default('us-east-1a,us-east-1b') }}"
  tasks:
    - name: Create cluster configuration
      ansible.builtin.shell: |
        kops create cluster \
        --name={{ cluster_name }} \
        --state={{ state_store }} \
        --zones={{ zones }} \
        --node-count={{ worker_nodes | length }} \
        --node-size=t3.medium \
        --master-size=t3.medium \
        --yes
      register: cluster_creation

    - name: Validate cluster
      ansible.builtin.shell: |
        kops validate cluster \
        --name={{ cluster_name }} \
        --state={{ state_store }} \
        --wait 10m