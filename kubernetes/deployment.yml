apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator
  namespace: calculator-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calculator
  template:
    metadata:
      labels:
        app: calculator
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values: ["calculator"]
              topologyKey: "topology.kubernetes.io/zone"
      containers:
      - name: calculator
        image: joannedada/calculator:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8081